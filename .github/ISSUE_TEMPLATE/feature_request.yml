name: Idea or feature
description: A new game, peripheral, board port or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like NandTier to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful, and for whom?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I would like to work on this myself.
